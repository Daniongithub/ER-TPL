<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="author" content="ER-TPL Team">
    <title>SetaAPI - Pannello di amministrazione</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body data-bs-theme="dark">
    <div id="loading-container">
        <div class="d-flex justify-content-center align-items-center h-100">
            <div class="spinner-border m-5" role="status"></div>
        </div>
    </div>
    <div id="page-container" class="d-none">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <h3 class="navbar-brand fs-3 mb-0" href="#">SetaAPI</h3>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto">
                        <li><a class="nav-link active" href="/seta_modena/servizi/cercaorario/index.html">Cerca orario</a></li>
                        <li><a class="nav-link active" href="/seta_modena/servizi/cercaorario/index.html">Bus in servizio</a></li>
                    </ul>
                    <ul class="navbar-nav ms-auto text-end fw-bold">
                        <li><a class="nav-link" href="#" onclick="logoutUser();"><i class="bi bi-box-arrow-right me-1"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="d-flex justify-content-end m-2" id="operation-buttons-container">
            <button class="btn btn-primary fw-bold m-1" data-bs-toggle="modal" data-bs-target="#add-form-div">
                <i class="bi bi-plus-square-fill m-1"></i>
                Aggiungi assegnazione
            </button>
            <button class="btn btn-danger fw-bold m-1" data-bs-toggle="modal" data-bs-target="#remove-form-div">
                <i class="bi bi-trash3-fill m-1"></i>
                Rimuovi assegnazione
            </button>
            <button class="btn btn-outline-primary fw-bold m-1" data-bs-toggle="modal" data-bs-target="#change-form-div">
                <i class="bi bi-arrow-repeat m-1"></i>
                Cambio mezzo
            </button>
        </div>
        <ul class="nav nav-tabs mb-3" id="view-tabs-ul">
            <li class="nav-item">
                <button class="nav-link active" id="list-button" onclick="switchView('list', this);">Assegnazioni</button>
            </li>
            <li class="nav-item">
                <button class="nav-link" id="search-table-button" onclick="switchView('search-vtable', this);">Cerca tabella oraria</button>
            </li>
        </ul>
        <div class="m-2">
            <h3 class="fw-bold" id="table-title">Assegnazioni:</h3>
            <hr class="mb-0">
        </div>
        <div class="border border-secondary mx-2">
            <div class="d-flex justify-content-center mx-2 d-none" id="search-bar-container">
                <input type="text" id="search-bar" class="w-25 form-control rounded-0 m-1" placeholder="Cerca una fermata..." autocomplete="off">
            </div>
            <div class="d-flex justify-content-center mx-2 d-none" id="nav-buttons-container">
                <button class="btn btn btn-secondary fw-bold m-1" onclick="switchView('search-vtable', document.getElementById('search-table-button'));">Torna indietro</button>
            </div>
            <div class="w-100 overflow-x-scroll" id="table-container"></div>
        </div>
    </div>
    <div id="forms-container">
        <div class="modal fade" id="add-form-div" tabindex="-1" aria-labelledby="add" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5">Aggiungi assegnazione</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p class="fw-bold mb-2 mt-0">Tabella oraria:</p>
                        <input type="text" class="form-control" id="vehicle-table-input" autocomplete="off">
                        <div id="add-table-message-div"></div>
                        <p class="fw-bold my-2">Veicolo:</p>
                        <input type="text" class="form-control" id="vehicle-input" autocomplete="off">
                        <div id="add-vehicle-message-div"></div>
                        <div id="error-message-div"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
                        <button type="button" class="btn btn-primary" onclick="submitAddForm();">Aggiungi</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" id="remove-form-div" tabindex="-1" aria-labelledby="remove" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5">Rimuovi assegnazione</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p class="fw-bold mb-2 mt-0">Tabella oraria:</p>
                        <input type="text" class="form-control" id="remove-vehicle-table-input" autocomplete="off">
                        <div id="remove-table-message-div"></div>
                        <div id="remove-error-message-div"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
                        <button type="button" class="btn btn-primary" onclick="submitRemoveForm();">Rimuovi</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal fade" id="change-form-div" tabindex="-1" aria-labelledby="remove" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h1 class="modal-title fs-5">Cambio mezzo</h1>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p class="fw-bold mb-2 mt-0">Il veicolo:</p>
                        <input type="text" class="form-control" id="change-vehiclefrom-input" autocomplete="off">
                        <div id="change-vehiclefrom-message-div"></div>
                        <p class="fw-bold mb-2 my-2">Viene sostituito da:</p>
                        <input type="text" class="form-control" id="change-vehicleto-input" autocomplete="off">
                        <div id="change-vehicleto-message-div"></div>
                        <div id="change-error-message-div"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
                        <button type="button" class="btn btn-primary" onclick="submitChangeForm();">Cambia</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/script.js"></script>
    <script src="js/forms.js"></script>
</body>
</html>
