<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="ER-TPL Team">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ER-TPL Mezzi - Pannello di amministrazione</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body data-bs-theme="dark">
    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid">
            <h1 class="navbar-brand fs-3 mb-0">ER-TPL Mezzi</h1>
        </div>
    </nav>
    <main class="container-fluid py-3">
        <div id="page-message" class="d-none alert" role="status" aria-live="polite"></div>
        <ul class="nav nav-tabs mb-3" id="company-tabs" role="tablist" aria-label="Azienda">
            <li class="nav-item" role="presentation"><button class="nav-link active" id="tab-START" data-bs-toggle="tab" data-bs-target="#panel-START" type="button" role="tab" aria-controls="panel-START" aria-selected="true">START</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" id="tab-METE" data-bs-toggle="tab" data-bs-target="#panel-METE" type="button" role="tab" aria-controls="panel-METE" aria-selected="false">METE</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" id="tab-SETA" data-bs-toggle="tab" data-bs-target="#panel-SETA" type="button" role="tab" aria-controls="panel-SETA" aria-selected="false">SETA</button></li>
            <li class="nav-item" role="presentation"><button class="nav-link" id="tab-TPER" data-bs-toggle="tab" data-bs-target="#panel-TPER" type="button" role="tab" aria-controls="panel-TPER" aria-selected="false">TPER</button></li>
        </ul>
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
            <h2 class="fs-4 fw-bold mb-0" id="table-title">Mezzi START</h2>
            <div class="d-flex flex-wrap gap-2" id="operation-buttons">
                <button type="button" class="btn btn-primary fw-bold" id="add-button" disabled><i class="bi bi-plus-square-fill me-1" aria-hidden="true"></i>Aggiungi mezzo</button>
                <button type="button" class="btn btn-outline-primary fw-bold" id="batch-button" disabled><i class="bi bi-plus-square-dotted me-1" aria-hidden="true"></i>Aggiungi in batch</button>
                <button type="button" class="btn btn-danger fw-bold" id="delete-button" disabled><i class="bi bi-trash3-fill me-1" aria-hidden="true"></i>Rimuovi selezionati</button>
                <button type="button" class="btn btn-success fw-bold" id="save-button" disabled><i class="bi bi-floppy-fill me-1" aria-hidden="true"></i>Salva modifiche</button>
            </div>
        </div>
        <div class="d-flex flex-wrap gap-2 align-items-center mb-2">
            <label for="search-input" class="visually-hidden">Cerca nei mezzi dell’azienda</label>
            <input type="search" class="form-control" id="search-input" placeholder="Cerca matricola, targa, modello…" autocomplete="off">
            <button type="button" class="btn btn-secondary" id="reload-button">Aggiorna</button>
            <span class="text-body-secondary" id="table-summary" aria-live="polite"></span>
        </div>
        <div class="tab-content" id="company-panels">
            <section class="tab-pane show active" id="panel-START" role="tabpanel" aria-labelledby="tab-START" tabindex="0"></section>
            <section class="tab-pane" id="panel-METE" role="tabpanel" aria-labelledby="tab-METE" tabindex="0"></section>
            <section class="tab-pane" id="panel-SETA" role="tabpanel" aria-labelledby="tab-SETA" tabindex="0"></section>
            <section class="tab-pane" id="panel-TPER" role="tabpanel" aria-labelledby="tab-TPER" tabindex="0"></section>
        </div>
    </main>
    <div class="modal fade" id="add-modal" tabindex="-1" aria-labelledby="add-title" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <form class="modal-content" id="add-form">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="add-title">Aggiungi mezzo</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
                </div>
                <div class="modal-body">
                    <p id="add-description" class="text-body-secondary"></p>
                    <div class="row g-3 mb-3 d-none" id="batch-range">
                        <div class="col-sm-6"><label for="batch-from" class="form-label fw-bold">Dalla matricola</label><input type="number" class="form-control" id="batch-from" min="0" max="2147483647" step="1"></div>
                        <div class="col-sm-6"><label for="batch-to" class="form-label fw-bold">Alla matricola (inclusa)</label><input type="number" class="form-control" id="batch-to" min="0" max="2147483647" step="1"></div>
                    </div>
                    <div class="row g-3" id="add-fields"></div>
                    <div class="alert alert-danger mt-3 d-none request-error" id="add-error" role="alert"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
                    <button type="submit" class="btn btn-primary" id="add-submit">Aggiungi</button>
                </div>
            </form>
        </div>
    </div>
    <div class="modal fade" id="delete-modal" tabindex="-1" aria-labelledby="delete-title" aria-hidden="true">
        <div class="modal-dialog">
            <form class="modal-content" id="delete-form">
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="delete-title">Rimuovi mezzi</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Chiudi"></button>
                </div>
                <div class="modal-body">
                    <p id="delete-description"></p>
                    <p class="number-list border rounded p-2" id="delete-numbers"></p>
                    <div class="alert alert-danger d-none request-error" id="delete-error" role="alert"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Annulla</button>
                    <button type="submit" class="btn btn-danger">Conferma rimozione</button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
