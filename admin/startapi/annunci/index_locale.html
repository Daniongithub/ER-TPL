<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="ER-TPL Team">
    <title>StartAPI - Annunci</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</head>
<body data-bs-theme="dark">
    <div id="loading-container">
        <div class="d-flex justify-content-center align-items-center h-100">
            <div class="spinner-border m-5" role="status"><span class="visually-hidden">Caricamento...</span></div>
        </div>
    </div>
    <div id="page-container" class="d-none">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <h3 class="navbar-brand fs-3 mb-0">StartAPI</h3>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Apri navigazione">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav ms-auto text-end fw-bold">
                        <li><a class="nav-link" href="#" onclick="logoutUser();"><i class="bi bi-box-arrow-right me-1"></i>Logout</a></li>
                    </ul>
                </div>
            </div>
        </nav>
        <div class="m-2">
            <h3 class="fw-bold" id="table-title">Annunci:</h3>
        </div>
        <div class="mx-2">
            <hr class="mb-0">
            <p class="fw-bold my-2">Messaggio attuale:</p>
            <span id="current-message-span" class="bg-3"></span>
            <p class="fw-bold my-2">Modifica il messaggio: <span class="opacity-50 fw-normal">(Supporta HTML)</span></p>
            <input type="text" id="message-input" class="w-100 form-control rounded my-1" placeholder="Nuovo messaggio...">
            <p id="error-p" class="text-danger my-2 fw-bold"></p>
            <button class="btn btn-primary my-2" onclick="submitMessage();">Conferma</button>
            <button class="btn btn-secondary my-2" onclick="window.location.reload();">Annulla</button>
            <button class="btn btn-danger my-2" onclick="emptyMessage();">Svuota</button>
        </div>
    </div>
    <script src="js/auth_locale.js"></script>
    <script src="js/script.js"></script>
    <script src="js/forms.js"></script>
</body>
</html>
